; Desktop builds of the game, published as GitHub Release assets: bash scripts/export_game.sh (see CONTRIBUTING.md).
; Both presets ship every resource plus the JSON data (and font license) that the game reads with FileAccess. The unit
; tests and the playtest/traversal tools stay out. The world in assets/world/ is a build output: run
; scripts/build_runtime.sh first.

[preset.0]

name="Windows Desktop"
platform="Windows Desktop"
runnable=true
dedicated_server=false
custom_features=""
export_filter="all_resources"
include_filter="*.json, *.txt"
exclude_filter="tests/*, tools/*"
export_path="export/windows/MisoStory.exe"
encryption_include_filters=""
encryption_exclude_filters=""
encrypt_pck=false
encrypt_directory=false

[preset.0.options]

binary_format/embed_pck=true
binary_format/architecture="x86_64"
texture_format/s3tc_bptc=true
texture_format/etc2_astc=false
debug/export_console_wrapper=0
application/product_name="MisoStory"
application/file_description="MisoStory: classic Maple Island as an isometric 3D game"

[preset.1]

name="Linux"
platform="Linux"
runnable=true
dedicated_server=false
custom_features=""
export_filter="all_resources"
include_filter="*.json, *.txt"
exclude_filter="tests/*, tools/*"
export_path="export/linux/MisoStory.x86_64"
encryption_include_filters=""
encryption_exclude_filters=""
encrypt_pck=false
encrypt_directory=false

[preset.1.options]

binary_format/embed_pck=true
binary_format/architecture="x86_64"
texture_format/s3tc_bptc=true
texture_format/etc2_astc=false
